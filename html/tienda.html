<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novatech - Tienda</title>
    <link rel="icon" type="image/png" href="/images/logo-n.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <div class="container">
        <header class="header">TIENDA</header>
        <div class="content-area">
            <aside class="categories">
                <h3>Categorías</h3>
                <ul id="category-list">
                    <li class="active" data-category="all">Todos</li>
                    <li data-category="laptops">Laptops</li>
                    <li data-category="monitores">Monitores</li>
                    <li data-category="audifonos">Audifonos</li>
                    <li data-category="teclados">Teclados</li>
                    <li data-category="mouses">Mouses</li>
                    <li data-category="webcams">Webcams</li>
                    <li data-category="altavoces">Altavoces</li>
                </ul>
            </aside>
            <section class="product-list" id="product-grid">
            </section>
        </div>
    </div>
    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-y0N/0k+i/2B1X+5aQWp8uJ/gL7kQ1b4qMv3pG7vW7T0pL4fFfRjFqJg9qV5hLd" crossorigin="anonymous"></script>
    <script src="/scripts/script2.js"></script> 
</body>
</html>
