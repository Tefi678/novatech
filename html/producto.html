<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="product-page-title">Detalles del Producto - Novatech</title>
    <link rel="icon" type="image/png" href="/images/logo-n.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style6.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container my-5">
        <div class="card product-detail-card shadow-lg">
            <div class="row g-0">
                <div class="col-md-6 p-3 d-flex align-items-center justify-content-center">
                    <img id="product-image" src="/images/placeholder.jpg" class="img-fluid rounded-start product-img-custom" alt="Imagen del Producto" loading="lazy">
                </div>

                <div class="col-md-6">
                    <div class="card-body p-4 d-flex flex-column h-100">
                        <p class="text-muted mb-1"><small id="product-category"></small> | <strong id="product-brand"></strong></p>
                        
                        <h1 class="card-title display-6 fw-bold mb-2" id="product-name">Cargando...</h1>
                        
                        <p class="mb-3">Modelo: <span id="product-model" class="fw-normal"></span> | Color: <span id="product-color" class="fw-normal"></span></p>

                        <div class="mb-4 description-scroll">
                            <h5 class="fw-semibold">Descripción:</h5>
                            <p class="card-text" id="product-description">Cargando detalles del producto...</p>
                        </div>

                        <div class="d-flex align-items-center mb-3">
                            <span class="product-rating" id="product-rating"></span>
                            <span class="ms-2 text-muted"><small id="product-stock"></small></span>
                        </div>

                        <div class="mt-auto pt-3 border-top">
                            <h2 class="text-primary fw-bolder mb-3" id="product-price"></h2>
                            
                            <button type="button" class="btn btn-success btn-lg w-100 add-to-cart-btn" disabled>
                                <i class="fas fa-shopping-bag me-2"></i>Añadir a la cesta
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-y0N/0k+i/2B1X+5aQWp8uJ/gL7kQ1b4qMv3pG7vW7T0pL4fFfRjFqJg9qV5hLd" crossorigin="anonymous"></script>
    <script src="/scripts/script6.js"></script>
</body>
</html>
