<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novatech - Contacto</title>
    <link rel="icon" type="image/png" href="/images/logo-n.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style3.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="container my-5 py-5">
        <h1 class="text-center fw-bold display-4 mb-5 text-primary">Contáctanos</h1>

        <div class="row g-4 contact-content-row">
            <div class="col-12 col-lg-8">
                <div class="map-section-real shadow-lg mb-5 rounded-3">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15309.805244565655!2d-66.15545939223126!3d-17.39126396860183!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x93e373f1519782a9%3A0x6e788ed0e23b10c5!2sCochabamba!5e0!3m2!1sen!2sbo!4v1635091200000!5m2!1sen!2sbo" 
                        allowfullscreen="" 
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        class="map-iframe-styled"
                        title="Ubicación de Novatech en Cochabamba, Bolivia"
                    ></iframe>
                </div>

                <div class="contact-form-card shadow-lg p-4 p-md-5 rounded-3">
                    <h3 class="form-title text-primary mb-4">Envíanos un Mensaje</h3>
                    <form id="contactForm" action="https://formspree.io/f/tu-hash-a-srlnovatech6@gmail.com" method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control custom-input bg-dark text-light border-primary" id="name" name="Nombre" placeholder="Nombre Completo" required>
                            </div>
                            <div class="col-md-6">
                                <input type="tel" class="form-control custom-input bg-dark text-light border-primary" id="phone" name="Telefono" placeholder="Teléfono" required>
                            </div>
                            <div class="col-12">
                                <input type="email" class="form-control custom-input bg-dark text-light border-primary" id="email" name="_replyto" placeholder="Correo Electrónico (novatechstrl6@gmail.com)" required>
                            </div>
                            <div class="col-12">
                                <textarea class="form-control custom-input bg-dark text-light border-primary" id="message" name="Mensaje" placeholder="Tu Mensaje o Consulta" rows="4" required></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary custom-send-btn w-100">
                                    ENVIAR MENSAJE
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-12 col-lg-4 details-section-sidebar">
                <div class="p-4 rounded-3 shadow-lg bg-dark h-100">
                    <h2 class="text-primary fw-bold mb-3">Información de Contacto</h2>
                    
                    <div class="mb-4">
                        <h3 class="fs-5 text-light mt-3"><i class="fas fa-map-marker-alt me-2 text-primary"></i> Dirección</h3>
                        <p>Cochabamba, Cercado Bolivia</p>
                        <p class="small text-muted">Calle Mariano Borda</p>
                    </div>

                    <div class="mb-4">
                        <h3 class="fs-5 text-light mt-3"><i class="fas fa-phone me-2 text-primary"></i> Teléfono</h3>
                        <p><a href="tel:+59171496903" class="text-light text-decoration-none transition-hover-primary">(+34) 947 002 963</a></p>
                    </div>

                    <div class="mb-4">
                        <h3 class="fs-5 text-light mt-3"><i class="fas fa-envelope me-2 text-primary"></i> Email</h3>
                        <p><a href="mailto:novatechstrl6@gmail.com" class="text-light text-decoration-none transition-hover-primary">novatechstrl6@gmail.com</a></p>
                    </div>

                    <hr class="border-primary opacity-25">

                    <h2 class="text-primary fw-bold mb-3">Horario de Atención</h2>
                    <div class="opening-hours">
                        <p>Lunes - Sábado: 8am - 6pm</p>
                        <p>Domingo: Cerrado</p>
                    </div>

                    <hr class="border-primary opacity-25">

                    <h2 class="text-primary fw-bold mb-3">Redes Sociales</h2>
                    <div class="social-links mt-3">
                        <a href="https://facebook.com/Novatech" target="_blank" class="text-light me-4 fs-4 transition-hover-primary"><i class="fab fa-facebook"></i></a>
                        <a href="https://tiktok.com/@Novatech" target="_blank" class="text-light me-4 fs-4 transition-hover-primary"><i class="fab fa-tiktok"></i></a>
                        <a href="#" target="_blank" class="text-light fs-4 transition-hover-primary"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="/scripts/script3.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
